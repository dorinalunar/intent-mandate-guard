<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer matching the dark theme -->
  <rect width="120" height="120" fill="#0b0f17" rx="16" />

  <!-- Shield Emblem Centered -->
  <g transform="translate(10, 12)">
    <!-- Outer Shield Frame -->
    <path d="M 50 5 L 85 22 L 85 58 C 85 82 50 96 50 96 C 50 96 15 82 15 58 L 15 22 Z"
          fill="url(#innerGlow)" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Inner Protective Contour -->
    <path d="M 50 15 L 75 27 L 75 55 C 75 73 50 84 50 84 C 50 84 25 73 25 55 L 25 27 Z"
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round" />

    <!-- Intent Arrow & Constellation Vector -->
    <g filter="url(#neonGlow)">
      <!-- Intent Constellation Path -->
      <polyline points="35,62 44,46 56,46 64,36" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Nodes -->
      <circle cx="35" cy="62" r="3" fill="#38bdf8" stroke="#0b0f17" stroke-width="1.5" />
      <circle cx="44" cy="46" r="3" fill="#38bdf8" stroke="#0b0f17" stroke-width="1.5" />
      <circle cx="56" cy="46" r="3" fill="#38bdf8" stroke="#0b0f17" stroke-width="1.5" />
      <circle cx="64" cy="36" r="3" fill="#38bdf8" stroke="#0b0f17" stroke-width="1.5" />

      <!-- Directed Forward Arrow -->
      <path d="M 40 54 L 62 54 L 54 46 M 62 54 L 54 62" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
